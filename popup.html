<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <head>
        <title>QA Form Filler</title>
        <link rel="stylesheet" href="popup.css">
    </head>

    <body>
        <h3>QA Form Filler</h3>
        <div class="toolRow">
            <button id="scanBtn"> Scan Form</button>
            <button id="highlightModeBtn"> Highlight</button>
            <button id="clearhighlightBtn"> Clear Highlight</button>
        </div>
        <hr>
        <button id="exportBtn"> Export Excel</button>
        <button id="importBtn"> Import Excel</button>
        <h4>Saved Test Cases</h4>
        <div id="testCaseList"></div>
        <input
            type="file"
            id="importFile"
            accept=".xlsx,.xls"
            multiple
            style="display:none"
        />
        <div id="importInfo"></div>
        <button id="fillBtn"> Fill Form</button>
        <pre id="resultContainer"></pre>
        <script src="lib/xlsx.full.min.js"></script>
        <script src="src/constants.js"></script>
        <script src="src/storage.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
