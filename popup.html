<!DOCTYPE html>
<html>
    <head>
        <title>QA Form Filler</title>
        <style>
            body{
                width:500px;
                padding:10px;
                font-family:Arial;
            }

            button{
                width:100%;
                margin-bottom:10px;
            }

            pre{
                background:#f5f5f5;
                padding:10px;
                max-height:500px;
                overflow:auto;
                font-size:12px;
            }
        </style>
    </head>

    <body>
        <h3>QA Form Filler</h3>
        <button id="scanBtn">Scan Form</button>
        <button id="highlightModeBtn">Highlight</button>
        <button id="clearhighlightBtn">Clear Highlight</button>
        <button id="exportBtn">Export Excel</button>
        <button id="importBtn">Import Excel</button>
        <input
            type="file"
            id="importFile"
            accept=".xlsx,.xls"
            style="display:none"
        />
        <pre id="resultContainer"></pre>
        <script src="popup.js"></script>
    </body>
</html>
